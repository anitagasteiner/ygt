<div class="main-container">

    <h2>Progress Board</h2>

    <div class="board">
        <div class="shadow">
            <div>123</div>
            <div>Invoices Received</div>            
        </div>
        <div class="shadow">
            <div>12</div>
            <div>Submitted to <span title="Public Health Insurance">ÖGK</span></div>
        </div>
        <div class="shadow">
            <div>12</div>
            <div>Refunded by <span title="Public Health Insurance">ÖGK</span></div>
        </div>
        <div class="shadow">
            <div>12</div>
            <div>Submitted to <span title="Supplementary Health Insurance">muki</span></div>
        </div>
        <div class="shadow">
            <div>12</div>
            <div>Refunded by <span title="Supplementary Health Insurance">muki</span></div>
        </div>
        <div class="shadow" routerLink="/invoices">
            <div>{{ invoicesCount$ | async }}</div>
            <div>Invoices</div>
        </div>
    </div>

    <!-- @if (unsortedInvoices$ | async; as unsortedInvoices) {
        @for (unsortedInvoice of unsortedInvoices$ | async; track unsortedInvoice.id; let index = $index) {
            <div>{{ unsortedInvoice.id }}</div>
        }
    } -->

    <button class="shadow" (click)="showAddInvoiceForm()"><b>+</b> Add Invoice</button>

    @if (invoicesService.newInvoiceFormOpened) {
        <div class="addInvoiceFormBg">
            <div class="addInvoiceFormContainer">
                <div class="addInvoiceFormHead">
                    <h2>Add Invoice</h2>
                    <img (click)="hideAddInvoiceForm()" class="btn-close" src="assets/img/icon_close.png">
                </div>                
                <app-add-invoice-form></app-add-invoice-form>
            </div>            
        </div>
    }

</div>
